<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusiTeacher Randomizer</title>
    <!--
      عجلة الاختيار العشوائي — نقطة الدخول الرئيسية (الواجهة الأصلية كما كانت).
      مكتبة الدروس التفاعلية (library.html) ليست واجهة مستقلة: تُفتح اختياريًا من «إعداد الاسئلة»
      وتمدّ العجلة بالأسئلة فقط (lib/import-bridge.js). المسارات مطلقة لأن التطبيق يغيّر عنوان الصفحة.
      النسخة غير المرقّعة من الحزمة باقية للاسترجاع: assets/index-7H3NVY4Q.js
    -->
    <script>
      // تمرير مسار داخلي اختياري (مثل /dashboard?templateId=…) قبل تشغيل التطبيق، كما كان يتنقل داخليًا.
      (function () {
        try {
          var raw = sessionStorage.getItem('rz-launch');
          if (!raw) return;
          sessionStorage.removeItem('rz-launch');
          var o = JSON.parse(raw);
          if (o && typeof o.path === 'string' && /^\/(dashboard)?(\?templateId=[\w%.-]+)?$/.test(o.path)) history.replaceState(null, '', o.path);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script src="/games/musiteacher-randomizer/lib/import-bridge.js"></script>
    <script type="module" crossorigin src="/games/musiteacher-randomizer/assets/index-rz-20261121.js"></script>
    <link rel="stylesheet" crossorigin href="/games/musiteacher-randomizer/assets/index-JT2PT6OX.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
